name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: the generated sources still match the workflow exports
        run: npm run check-drift
      - name: every test, including that n8n runs these exact bytes
        run: npm test

  db:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
        ports:
          - 5432:5432
    env:
      CHECK_DATABASE_URL: postgres://postgres:ci@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: the schema builds from empty and the seed is idempotent
        run: npm run db:check
      - name: every decision can be stored, read back and handed to its lane
        run: npm run db:round-trip
      - name: a price list copies into the catalogue without half-applying
        run: npm run catalogue:round-trip
      - name: a conversation that runs for days keeps one order and one set of facts
        run: npm run conversation:round-trip

  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: the rules the hooks enforce locally, enforced for everyone
        run: |
          git fetch --no-tags origin main
          npm run guards -- origin/main --branch "${BRANCH:-detached}"
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}

  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: install gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/
      - name: no secret anywhere in the working tree
        run: gitleaks detect --no-git --redact --config .gitleaks.toml -v
      - name: no secret anywhere in the history
        run: gitleaks detect --redact --config .gitleaks.toml -v
